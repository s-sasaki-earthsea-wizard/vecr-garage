# VECR Garage CI/CD ワークフロー
# ============================================================
# プルリクエストとプッシュ時に自動的にコード品質チェックを実行
# ローカルのpre-commit hooksと同じチェックをリモートでも実行
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同じブランチの古いワークフローをキャンセル
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit チェック
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Node.js 20 をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Go をセットアップ（checkmake用）
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: checkmake をインストール
        run: go install github.com/checkmake/checkmake/cmd/checkmake@latest

      - name: Node.js ツールをインストール
        run: npm install -g eslint prettier

      - name: Python ツールをインストール
        run: pip install djlint

      - name: PATH に Go bin を追加
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Pre-commit を実行
        uses: pre-commit/action@v3.0.1
