AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  backend-db-registration Lambda function
  S3イベントトリガーによるメンバー登録処理

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: デプロイ環境

  S3BucketName:
    Type: String
    Default: vecr-garage-dev
    Description: S3バケット名

Resources:
  MemberRegistrationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vecr-garage-${Environment}-member-registration
      CodeUri: src/
      Handler: lambda_handler.handler
      Description: S3イベントトリガーによるメンバー登録Lambda関数
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
          AWS_REGION: !Ref AWS::Region
          WEBHOOK_ETAG_CHECK_ENABLED: "false"
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref S3BucketName
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:vecr-garage-${Environment}-app-secrets-*
      Events:
        S3Event:
          Type: S3
          Properties:
            Bucket: !Ref S3Bucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: data/
                  - Name: suffix
                    Value: .yml

  # ローカル開発時はこのバケットは作成されない（既存バケットを使用）
  S3Bucket:
    Type: AWS::S3::Bucket
    Condition: CreateS3Bucket
    Properties:
      BucketName: !Ref S3BucketName

Conditions:
  CreateS3Bucket: !Equals [!Ref Environment, 'local']

Outputs:
  MemberRegistrationFunctionArn:
    Description: Lambda関数のARN
    Value: !GetAtt MemberRegistrationFunction.Arn

  MemberRegistrationFunctionName:
    Description: Lambda関数名
    Value: !Ref MemberRegistrationFunction
